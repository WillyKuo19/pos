<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="POS">
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>小店 POS</title>
<style>
:root{
  --ink:#16201d; --muted:#5f6b67; --line:rgba(30,50,44,.12);
  --brand:#1f7a63; --brand2:#2a9b7e; --brand-ink:#fff; --brand-soft:rgba(42,155,126,.16);
  --warn:#d07a1c; --warn-soft:rgba(240,160,70,.22); --bad:#c0392f; --bad-soft:rgba(220,80,70,.14);
  --busy:#2f62b0; --busy-soft:rgba(80,130,220,.2);
  --glass:rgba(255,255,255,.52); --glass-hi:rgba(255,255,255,.74); --glass-edge:rgba(255,255,255,.75);
  --glass-shadow:0 10px 30px rgba(24,48,40,.10),0 1px 2px rgba(24,48,40,.06),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.35);
  --blur:blur(22px) saturate(185%);
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,1,.36,1);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{background:
  radial-gradient(60vw 60vw at 8% 5%,rgba(120,205,175,.55),transparent 60%),
  radial-gradient(50vw 50vw at 95% 0%,rgba(250,196,150,.55),transparent 60%),
  radial-gradient(60vw 60vw at 80% 100%,rgba(150,180,240,.5),transparent 60%),
  radial-gradient(40vw 40vw at 20% 95%,rgba(240,170,200,.35),transparent 60%),
  #eef1ee;background-attachment:fixed}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}

/* ---------- 玻璃材質 ---------- */
.glass,header.top,.btn,.tabs button,.item,.ticket,.floor,.tbl,.box,.card,.side,.chip,.mini,.dlg,.keypad button,.qty button,.catrow,.fld input,.fld select,.fld textarea,.disp,.toast{
  background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
/* 光澤：左上高光 */
.btn,.tabs button,.item,.chip,.mini,.keypad button,.qty button,.tbl,.card{position:relative;overflow:hidden;isolation:isolate}
.btn::before,.tabs button::before,.item::before,.chip::before,.mini::before,.keypad button::before,.qty button::before,.tbl::before,.card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(140deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.25) 100%)}
/* 按壓：彈性縮放 */
.btn,.tabs button,.item,.chip,.mini,.keypad button,.qty button,.side button,header.top nav button,.catrow,.switch{
  transition:transform .45s var(--spring),background-color .3s var(--ease),color .3s var(--ease),box-shadow .3s var(--ease),opacity .3s}
.btn:active,.tabs button:active,.item:active,.chip:active,.mini:active,.keypad button:active,.qty button:active,.side button:active,header.top nav button:active,.catrow:active{
  transform:scale(.94);transition-duration:.12s}

#app{display:flex;flex-direction:column;height:100%;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 12px);gap:10px}
header.top{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 18px;border-radius:999px;view-transition-name:top;flex-shrink:0}
header.top .shop{font-weight:800;font-size:18px;margin-right:10px;letter-spacing:.5px}
header.top nav{position:relative;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.35);box-shadow:inset 0 1px 3px rgba(20,40,34,.12)}
header.top nav button{position:relative;z-index:1;padding:9px 20px;border-radius:999px;color:var(--muted);font-weight:700}
header.top nav button.on{color:#fff}
.lens{position:absolute;z-index:0;border-radius:999px;pointer-events:none;
  transition:left .55s var(--spring),width .55s var(--spring),top .55s var(--spring),height .55s var(--spring);
  background:linear-gradient(180deg,rgba(52,170,138,.95),rgba(26,112,90,.95));
  box-shadow:0 6px 16px rgba(31,122,99,.35),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 4px rgba(0,0,0,.12)}
nav .lens{view-transition-name:navlens}
.lens.dark{background:linear-gradient(180deg,rgba(40,52,48,.92),rgba(18,26,23,.92));box-shadow:0 6px 16px rgba(10,20,16,.25),inset 0 1px 0 rgba(255,255,255,.3)}
header.top .right{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;padding-right:10px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#aaa;margin-right:6px;transition:background .3s}
.dot.ok{background:#22a35d;box-shadow:0 0 0 4px rgba(34,163,93,.18)}.dot.no{background:var(--bad);box-shadow:0 0 0 4px rgba(192,57,47,.18)}
main{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;view-transition-name:main}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch}
.btn{padding:11px 18px;border-radius:14px;font-weight:700;white-space:nowrap}
.btn.pri,.btn.warn,.chip.on,.switch.on{color:#fff;border-color:rgba(255,255,255,.35)}
.btn.pri{background:linear-gradient(180deg,rgba(52,170,138,.95),rgba(26,112,90,.95));box-shadow:0 8px 20px rgba(31,122,99,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.warn{background:linear-gradient(180deg,rgba(240,155,60,.95),rgba(205,115,25,.95));box-shadow:0 8px 20px rgba(208,122,28,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.bad{color:var(--bad)}
.btn.big{padding:17px 22px;font-size:18px;border-radius:18px}
.btn:disabled{opacity:.38;filter:saturate(.4)}
.muted{color:var(--muted)}
.tabs{position:relative;display:flex;gap:8px;min-width:0;padding:4px 2px 10px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;z-index:1;padding:9px 18px;border-radius:999px;font-weight:700;white-space:nowrap;transition:color .35s var(--ease),transform .45s var(--spring)}
.tabs button.on{color:#fff;background:transparent;border-color:transparent;box-shadow:none}
.tabs button.on::before{opacity:0}
.tabs .lens{z-index:0}

/* ---------- 桌位圖 ---------- */
.floorwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.floorbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.floor{position:relative;border-radius:24px;overflow:hidden;touch-action:none;
  background-color:rgba(255,255,255,.4);background-image:radial-gradient(rgba(30,60,50,.18) 1px,transparent 1.2px);background-size:22px 22px}
.tbl{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;
  font-weight:800;text-align:center;line-height:1.15;padding:4px;container-type:size;
  transition:transform .45s var(--spring),box-shadow .3s,background-color .3s}
.tbl.round{border-radius:50%}
.tbl .nm{font-size:clamp(11px,30cqmin,30px)}
.tbl .sub{font-size:clamp(9px,13cqmin,13px);font-weight:700;margin-top:2px;opacity:.9}
.tbl.busy{background:var(--busy-soft);color:var(--busy);border-color:rgba(120,160,235,.8)}
.tbl.unsent{background:var(--warn-soft);color:#93520c;border-color:rgba(240,170,90,.9)}
.tbl.unsent::after{content:"";position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--warn);animation:pulse 1.6s infinite}
.tbl[data-act=openTable]:active{transform:scale(.93)}
.tbl.sel{box-shadow:0 0 0 3px var(--brand2),0 12px 28px rgba(31,122,99,.3),inset 0 1px 0 #fff;z-index:5}
.tbl.edit{cursor:grab}
.tbl.dragging{transform:scale(1.06);box-shadow:0 22px 40px rgba(20,40,34,.25),inset 0 1px 0 #fff;z-index:9;transition:transform .3s var(--spring)}
.rh{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;z-index:6;touch-action:none;cursor:nwse-resize;
  background:linear-gradient(180deg,rgba(52,170,138,.95),rgba(26,112,90,.95));border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:900}
.tbl.round .rh{right:6%;bottom:6%}
.legend{display:flex;gap:16px;align-items:center;padding:0 4px 8px;font-size:13px;color:var(--muted);flex-shrink:0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:5px;border:1.5px solid #fff;background:var(--glass-hi);vertical-align:-2px;margin-right:5px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.legend .b{background:#b7cdf1}.legend .u{background:#f6cf9f}
.range{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.range span{width:44px;font-weight:700;color:var(--muted);font-size:14px}
.range b{width:42px;text-align:right;font-size:14px}
input[type=range]{flex:1;accent-color:var(--brand2);height:28px}

/* ---------- 點餐 ---------- */
.order{flex:1;min-height:0;display:grid;grid-template-columns:1fr 400px;gap:12px}
.menu{display:flex;flex-direction:column;min-height:0}
.items{flex:1;padding:4px 2px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.item{border-radius:var(--r);padding:16px 14px;text-align:left;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.item .n{font-weight:800;font-size:17px}
.item .p{color:var(--muted);font-weight:700}
.item.out{opacity:.45}
.item.out .p::after{content:"　售完";color:var(--bad)}
.ticket{display:flex;flex-direction:column;min-height:0;border-radius:24px;overflow:hidden;background:var(--glass-hi)}
.ticket .head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.ticket .head .t{font-size:24px;font-weight:900}
.lines{flex:1;padding:6px 0}
.line{display:flex;gap:8px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.line .info{flex:1;min-width:0}
.line .ln{font-weight:800}
.line .lo{font-size:13px;color:var(--muted)}
.line .lp{font-weight:800;min-width:64px;text-align:right}
.line.sent .ln::after{content:"已送";font-size:11px;font-weight:800;background:rgba(30,50,44,.08);color:var(--muted);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.line.new{background:rgba(255,236,205,.45)}
.line.pop{animation:pop .55s var(--spring)}
.qty{display:flex;align-items:center;gap:5px}
.qty button{width:36px;height:36px;border-radius:12px;font-weight:800;font-size:18px}
.qty span{min-width:24px;text-align:center;font-weight:800}
.ticket .foot{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sum{display:flex;justify-content:space-between;font-size:21px;font-weight:900}
.row{display:flex;gap:10px}.row>*{flex:1}.row>[style*="flex:0"]{flex:0 0 auto!important}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* ---------- 對話框 ---------- */
.mask{position:fixed;inset:0;background:rgba(20,34,30,.22);-webkit-backdrop-filter:blur(8px) saturate(140%);backdrop-filter:blur(8px) saturate(140%);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fadeIn .3s var(--ease) both}
.mask.out{animation:fadeOut .22s var(--ease) both}
.dlg{border-radius:28px;width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(34px) saturate(190%);backdrop-filter:blur(34px) saturate(190%);
  box-shadow:0 30px 70px rgba(10,30,24,.28),inset 0 1px 0 #fff;animation:dlgIn .5s var(--spring) both}
.mask.out .dlg{animation:dlgOut .22s var(--ease) both}
.dlg.wide{width:min(840px,100%)}
.dlg h3{margin:0;padding:18px 22px 12px;font-size:20px;font-weight:900}
.dlg .body{padding:8px 22px 16px;overflow:auto}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px 18px;flex-wrap:wrap}
.grp{margin-bottom:16px}
.grp .gt{font-weight:800;margin-bottom:8px}
.grp .gt small{font-weight:700;color:var(--muted);margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:999px;font-weight:700}
.chip.on{background:linear-gradient(180deg,rgba(52,170,138,.95),rgba(26,112,90,.95));box-shadow:0 6px 14px rgba(31,122,99,.28),inset 0 1px 0 rgba(255,255,255,.5);transform:scale(1.03)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-weight:700;font-size:14px;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:12px 14px;border-radius:14px;width:100%;outline:none;transition:box-shadow .25s}
.fld input:focus,.fld select:focus{box-shadow:0 0 0 3px rgba(42,155,126,.35),var(--glass-shadow)}
.fld .hint{font-size:13px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--brand2)}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);padding:13px 22px;border-radius:999px;z-index:99;font-weight:800;max-width:90vw;
  background:rgba(22,32,29,.78);color:#fff;border-color:rgba(255,255,255,.2);animation:toastIn .5s var(--spring) both}
.toast.bad{background:rgba(192,57,47,.85)}
.toast.out{animation:toastOut .25s var(--ease) both}

/* ---------- 結帳 ---------- */
.co{display:grid;grid-template-columns:1fr 300px;gap:22px}
.co .bill div{display:flex;justify-content:space-between;padding:4px 0}
.co .bill .tot{font-size:28px;font-weight:900;border-top:2px solid var(--ink);margin-top:8px;padding-top:10px}
.co .bill .chg{font-size:23px;font-weight:900;color:var(--brand)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{padding:16px 0;font-size:22px;font-weight:800;border-radius:16px}
.disp{font-size:30px;font-weight:900;text-align:right;padding:8px 14px;border-radius:16px;margin-bottom:10px;min-height:58px;border:2px solid rgba(42,155,126,.6)}

/* ---------- 報表、後台 ---------- */
.page{flex:1;padding:2px;display:flex;flex-direction:column;gap:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.card{border-radius:var(--r);padding:14px 18px}
.card .k{color:var(--muted);font-size:14px;font-weight:700}
.card .v{font-size:27px;font-weight:900;margin-top:4px}
.box{border-radius:22px;padding:16px 18px;background:var(--glass-hi)}
.box h4{margin:0 0 10px;font-size:17px;font-weight:900}
table.t{width:100%;border-collapse:collapse}
table.t th,table.t td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
table.t th{color:var(--muted);font-size:13px;font-weight:800}
table.t td.n,table.t th.n{text-align:right}
tr.void td{color:#aaa;text-decoration:line-through}
.admin{flex:1;min-height:0;display:grid;grid-template-columns:210px 1fr;gap:12px}
.side{border-radius:24px;padding:10px;display:flex;flex-direction:column;gap:4px;position:relative;align-self:start}
.side button{position:relative;z-index:1;text-align:left;padding:13px 16px;border-radius:14px;font-weight:700;color:var(--muted)}
.side button.on{color:#fff}
.cats{display:flex;flex-direction:column;gap:8px}
.catrow{display:flex;align-items:center;gap:6px;padding:9px 10px 9px 14px;border-radius:14px}
.catrow.on{background:var(--brand-soft);border-color:rgba(42,155,126,.5)}
.catrow .cn{flex:1;font-weight:800}
.mini{padding:7px 12px;border-radius:10px;font-size:14px;font-weight:700}
.mini:disabled{opacity:.35}
.switch{position:relative;width:50px;height:30px;border-radius:999px;background:rgba(30,50,44,.18);flex-shrink:0;box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:left .45s var(--spring),width .3s var(--ease)}
.switch:active::after{width:30px}
.switch.on{background:linear-gradient(180deg,#34aa8a,#1a705a)}.switch.on::after{left:23px}
.switch.on:active::after{left:17px}
.optrow{display:grid;grid-template-columns:1fr 110px 44px;gap:8px;margin-bottom:8px}
.optrow input{padding:10px 12px;border-radius:12px;border:1px solid var(--glass-edge);background:var(--glass);box-shadow:var(--glass-shadow)}
.preview{background:#fff;border:1px dashed #bbb;padding:14px 10px;font-family:"SF Mono",Menlo,Consolas,"PingFang TC",monospace;font-size:12px;line-height:1.35;white-space:pre;overflow-x:auto;margin:0 auto;width:max-content;min-width:300px;border-radius:6px}
.preview .w2{font-size:22px;font-weight:800}
.preview .h2{font-size:12px;transform:scaleY(1.6);transform-origin:left top;display:inline-block;margin-bottom:6px}
.preview .b{font-weight:800}
.preview .inv{background:#000;color:#fff}
.preview .cut{display:block;border-top:2px dashed #999;margin-top:6px;color:#999;text-align:center;font-size:10px}
.preview .c{display:block;text-align:center}

/* ---------- 動畫 ---------- */
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes dlgIn{from{opacity:0;transform:translateY(24px) scale(.92)}}
@keyframes dlgOut{to{opacity:0;transform:translateY(10px) scale(.96)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,30px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,10px) scale(.95)}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:none;opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(208,122,28,.5)}50%{box-shadow:0 0 0 6px rgba(208,122,28,0)}}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes leave{to{opacity:0;transform:translateY(-6px) scale(.99)}}
main.enter{animation:enter .45s var(--ease) both}
::view-transition-old(main){animation:leave .2s var(--ease) both}
::view-transition-new(main){animation:enter .45s var(--ease) both}
::view-transition-group(navlens){animation-duration:.55s;animation-timing-function:var(--spring)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================
   小店 POS v1 —— 單台 iPad、資料存在本機、WebPRNT 區網出單
   ========================================================= */
const KEY = 'pos.v1';
const COLS = 48; // 80mm 紙、標準字型一行 48 個半形字
const $ = (s, el = document) => el.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const pad2 = n => String(n).padStart(2, '0');
const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const fmtTime = t => { const d = new Date(t); return `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const hm = t => { const d = new Date(t); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };

/* ---------------- 資料 ---------------- */
function seed() {
  const c1 = uid(), c2 = uid(), c3 = uid();
  const gSpicy = uid(), gAdd = uid(), gIce = uid(), gSugar = uid();
  const a1 = uid();
  const tables = [];
  const pos = [[8, 12], [26, 12], [44, 12], [8, 50], [26, 50], [44, 50]];
  pos.forEach(([x, y], i) => tables.push({ id: uid(), areaId: a1, name: 'A' + (i + 1), x, y, shape: i === 2 ? 'rect' : 'sq' }));
  tables.push({ id: uid(), areaId: a1, name: 'B1', x: 72, y: 15, shape: 'round' });
  tables.push({ id: uid(), areaId: a1, name: 'B2', x: 72, y: 55, shape: 'round' });
  return {

/* ---------------- 出單（Star WebPRNT） ---------------- */
// 字寬：中日韓全形字算 2 格
function cw(s) { let w = 0; for (const ch of s) { const c = ch.codePointAt(0); w += (c >= 0x2E80 && !(c >= 0xFF61 && c <= 0xFF9F)) ? 2 : 1; } return w; }
function wrap(s, w) {
  const out = []; let cur = '', x = 0;
  for (const ch of s) { const k = cw(ch); if (x + k > w) { out.push(cur); cur = ''; x = 0; } cur += ch; x += k; }
  if (cur || !out.length) out.push(cur); return out;
}
const padR = (s, w) => s + ' '.repeat(Math.max(0, w - cw(s)));
const padL = (s, w) => ' '.repeat(Math.max(0, w - cw(s))) + s;
function lr(l, r, cols = COLS) { // 左右對齊；左邊太長就換行
  const rw = cw(r), lw = cols - rw - 1, ls = wrap(l, lw);
  return ls.map((s, i) => i === ls.length - 1 ? padR(s, lw) + ' ' + r : s).join('\n');
}
const rule = (ch = '-') => ch.repeat(COLS);

// 出單工作：[{t:'text',s,w,h,b,inv}, {t:'align',v}, {t:'feed',n}, {t:'cut'}, {t:'drawer'}]
const J = {
  txt: (s, o = {}) => ({ t: 'text', s, w: o.w || 1, h: o.h || 1, b: !!o.b, inv: !!o.inv }),
  align: v => ({ t: 'align', v }), feed: n => ({ t: 'feed', n }), cut: () => ({ t: 'cut' }), drawer: () => ({ t: 'drawer' }),
};
const xesc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
function toXML(job) {
  const cp = S.settings.codepage ? ` codepage="${xesc(S.settings.codepage)}"` : '';
  let x = '<root><initialization/>';
  for (const g of job) {
    if (g.t === 'align') x += `<alignment position="${g.v}"/>`;
    else if (g.t === 'text') x += `<text${cp} width="${g.w}" height="${g.h}" emphasis="${g.b}" invert="${g.inv}">${xesc(g.s + '\n').replace(/\n/g, '&#10;')}</text>`;
    else if (g.t === 'feed') x += `<feed line="${g.n}"/>`;
    else if (g.t === 'cut') x += '<cut type="partial" feed="true"/>';
    else if (g.t === 'drawer') x += '<peripheral channel="1" on="200" off="200"/>';
  }
  return x + '</root>';
}
function toPreview(job) {
  let align = 'left', out = '';
  for (const g of job) {
    if (g.t === 'align') align = g.v;
    else if (g.t === 'text') {
      const cls = [g.w > 1 ? 'w2' : '', g.h > 1 && g.w === 1 ? 'h2' : '', g.b ? 'b' : '', g.inv ? 'inv' : ''].join(' ');
      out += `<span class="${align === 'center' ? 'c ' : ''}${cls}">${h(g.s)}</span>\n`;
    } else if (g.t === 'feed') out += '\n'.repeat(Math.min(g.n, 2));
    else if (g.t === 'cut') out += '<span class="cut">✂ 切紙</span>';
    else if (g.t === 'drawer') out += '<span class="c muted">［開錢櫃］</span>\n';
  }
  return `<div class="preview">${out}</div>`;
}
async function sendWebPrnt(req) {
  const { printerIp, https } = S.settings;
  const url = `${https ? 'https' : 'http'}://${printerIp}/StarWebPRNT/SendMessage`;
  const soap = '<?xml version="1.0" encoding="utf-8"?>\n<s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/"><s:Body>' +
    '<StarWebPrint xmlns="http://www.star-m.jp" xmlns:i="http://www.w3.org/2001/XMLSchema-instance"><Request>' +
    xesc(req) + '</Request></StarWebPrint></s:Body></s:Envelope>';
  const ac = new AbortController(); const tm = setTimeout(() => ac.abort(), 10000);
  try {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/xml; charset=UTF-8' }, body: soap, signal: ac.signal });
    const txt = await res.text();
    const ok = /<success>\s*true\s*<\/success>/i.test(txt);
    printerState(true);
    if (ok) return { ok: true };
    const code = (/<code>(.*?)<\/code>/i.exec(txt) || [])[1] || ('HTTP ' + res.status);
    return { ok: false, msg: `出單機回應錯誤（${code}）：請檢查是否缺紙、上蓋沒蓋好。` };
  } catch (e) {
    printerState(false);
    return { ok: false, msg: e.name === 'AbortError' ? '連線逾時：請確認出單機電源、IP，以及 iPad 和出單機連在同一個網路。'
      : '連不到出單機：請確認 IP 正確，並且 iPad 已信任出單機的 HTTPS 憑證（見「設定」頁說明）。' };
  } finally { clearTimeout(tm); }
}
let printerOK = null;
function printerState(v) { printerOK = v; const d = $('#pdot'); if (d) d.className = 'dot ' + (v ? 'ok' : 'no'); }
function showPreview(job, title) {
  return modal(title, toPreview(job), [{ k: 'ok', t: '關閉', cls: 'pri' }]);
}
// 回傳 true = 已印出（或預覽模式）
async function printJob(job, label) {
  if (!S.settings.printerIp) { await showPreview(job, label + '（尚未設定出單機，先顯示預覽）'); return true; }
  for (; ;) {
    const r = await sendWebPrnt(toXML(job));
    if (r.ok) return true;
    const k = await modal('出單失敗', `<p style="margin-top:0"><b>${h(label)}</b> 沒有印出來。</p><p class="muted">${h(r.msg)}</p>`,
      [{ k: 'view', t: '看單據內容' }, { k: 'skip', t: '略過' }, { k: 'retry', t: '重試', cls: 'pri' }], { dismiss: false });
    if (k === 'retry') continue;
    if (k === 'view') await showPreview(job, label);
    return false;
  }
}

/* ---------- 液態玻璃的滑動指示（lens）與過場 ---------- */
const lensPos = {};
let inTransition = false;
function glideAll() {
  document.querySelectorAll('[data-lens]').forEach(box => {
    const key = box.dataset.lens, lens = box.querySelector(':scope > .lens'), on = box.querySelector(':scope > .on');
    if (!lens) return;
    if (!on) { lens.style.opacity = 0; return; }
    const to = { left: on.offsetLeft, top: on.offsetTop, width: on.offsetWidth, height: on.offsetHeight };
    const from = lensPos[key];
    const put = p => { lens.style.left = p.left + 'px'; lens.style.top = p.top + 'px'; lens.style.width = p.width + 'px'; lens.style.height = p.height + 'px'; };
    lens.style.opacity = 1;
    if (from && !inTransition && !reduceMotion) {
      lens.style.transition = 'none'; put(from); lens.offsetWidth; lens.style.transition = ''; put(to);
    } else put(to);
    lensPos[key] = to;
  });
}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
// 切換畫面：支援 View Transitions 的瀏覽器用原生過場，其餘用 CSS 動畫
function navigate(fn) {
  if (document.startViewTransition && !reduceMotion) {
    const vt = document.startViewTransition(() => { inTransition = true; fn(); inTransition = false; });
    vt.finished.catch(() => { });
  } else {
    fn(); const m = $('#main'); if (m && !reduceMotion) { m.classList.remove('enter'); m.offsetWidth; m.classList.add('enter'); }
  }
}
function fitFloors() {
  document.querySelectorAll('.floorbox').forEach(box => {
    const f = box.querySelector('.floor'); if (!f) return;
    const bw = box.clientWidth, bh = box.clientHeight;
    const w = Math.min(bw, bh * FLOOR_RATIO);
    f.style.width = w + 'px'; f.style.height = (w / FLOOR_RATIO) + 'px';
  });
}
window.addEventListener('resize', () => { fitFloors(); glideAll(); });

function addLine(item, opts, qty, note) {
  const o = getOrder(V.tableId, true);
  const key = item.id + '|' + opts.map(x => x.name).join(',') + '|' + note;
  const same = o.lines.find(l => !l.sent && l.key === key);
  if (same) { same.qty += qty; V.pop = same.id; }
  else o.lines.push({ id: V.pop = uid(), key, itemId: item.id, name: item.name, price: item.price, opts, qty, note, sent: false });
  save(); render();
}
async function pickOptions(item) {
  const groups = item.groups.map(groupById).filter(Boolean);

  const body = () => groups.map(g => `<div class="grp"><div class="gt">${h(g.name)}<small>${g.required ? '必選' : '可不選'}${g.multi ? '・可複選' : ''}</small></div>
    <div class="chips">${g.options.map((op, i) => `<button class="chip ${sel[g.id].includes(i) ? 'on' : ''}" data-g="${g.id}" data-i="${i}">${h(op.name)}${op.price ? ' +' + op.price : ''}</button>`).join('')}</div></div>`).join('') +
    `<div class="grp"><div class="gt">數量</div><div class="qty"><button data-q="-1">−</button><span id="oq">${qty}</span><button data-q="1">＋</button></div></div>
     <div class="fld"><label>備註（會印在廚房單）</label><input id="onote" placeholder="例如：不要蔥"></div>`;
  const k = await modal(`${item.name}　${money(item.price)}`, `<div id="ob">${body()}</div>`, [{ k: 'no', t: '取消' }, { k: 'ok', t: '加入', cls: 'pri' }], {
    onOpen: m => m.addEventListener('click', e => {
      const c = e.target.closest('[data-g]'); const q = e.target.closest('[data-q]');
      if (c) {
        const g = groupById(c.dataset.g), i = +c.dataset.i, arr = sel[g.id];
        if (g.multi) { const p = arr.indexOf(i); p >= 0 ? arr.splice(p, 1) : arr.push(i); }
        else sel[g.id] = arr[0] === i && !g.required ? [] : [i];
        c.parentElement.querySelectorAll('.chip').forEach((el, j) => el.classList.toggle('on', sel[g.id].includes(j)));
      }
      if (q) { qty = Math.max(1, qty + +q.dataset.q); $('#oq', m).textContent = qty; }

  if (k !== 'ok') return;
  const opts = []; groups.forEach(g => sel[g.id].sort((a, b) => a - b).forEach(i => opts.push({ g: g.name, name: g.options[i].name, price: +g.options[i].price || 0 })));
  addLine(item, opts, qty, pickOptions.note);
}
async function sendOrder() {
  const o = getOrder(V.tableId, false); if (!o) return;
  const lines = o.lines.filter(l => !l.sent); if (!lines.length) return;
  const ok = await printJob(kitchenJob(o, lines, o.sendCount ? '加點' : ''), '廚房單');
  if (!ok && !(await ask('沒有印出廚房單', '要把這些品項標記為「已送單」嗎？（請記得口頭告知廚房）', '標記已送'))) return;

async function voidLine(id) {

async function moveTable() {

/* ---------------- 結帳 ---------------- */
async function checkout() {
  const o = getOrder(V.tableId, false); if (!o || !o.lines.length) return;
  if (o.lines.some(l => !l.sent)) {
    const k = await modal('還有品項沒送單', '<p style="margin:0">要先送單給廚房，還是直接結帳？</p>',
      [{ k: 'no', t: '取消' }, { k: 'skip', t: '直接結帳' }, { k: 'send', t: '先送單', cls: 'warn' }]);
    if (!k || k === 'no') return;
    if (k === 'send') { await sendOrder(); if (o.lines.some(l => !l.sent)) return; }
  }
  const st = { method: 'cash', recv: '', discType: o.disc?.type || 'amt', discV: o.disc?.v ? String(o.disc.v) : '' };
  const calc = () => {
    const sub = orderSubtotal(o);
    const dv = +st.discV || 0;
    const disc = Math.min(sub, st.discType === 'pct' ? Math.round(sub * dv / 100) : dv);
    const total = sub - disc; const recv = +st.recv || 0;
    return { sub, disc, total, recv, change: recv - total };
  };
  const paint = m => {
    const c = calc();
    $('#bill', m).innerHTML = `<div><span>小計</span><span>${money(c.sub)}</span></div>
      ${c.disc ? `<div><span>折扣</span><span>-${money(c.disc)}</span></div>` : ''}
      <div class="tot"><span>應收</span><span>${money(c.total)}</span></div>
      ${st.method === 'cash' ? `<div><span>收現</span><span>${st.recv ? money(c.recv) : '—'}</span></div>
      <div class="chg"><span>找零</span><span>${st.recv && c.change >= 0 ? money(c.change) : st.recv ? '金額不足' : '—'}</span></div>` : '<div class="muted"><span>請用刷卡機刷卡後按完成</span></div>'}`;
    $('#disp', m).textContent = st.recv ? money(+st.recv) : '';
    $('#cashpad', m).style.display = st.method === 'cash' ? '' : 'none';
    m.querySelectorAll('[data-pm]').forEach(b => b.classList.toggle('on', b.dataset.pm === st.method));
    m.querySelectorAll('[data-dt]').forEach(b => b.classList.toggle('on', b.dataset.dt === st.discType));
  };
  const lines = o.lines.map(l => `<div><span>${h(l.name)} x${l.qty}${l.opts.length ? `<br><small class="muted">${h(optText(l))}</small>` : ''}</span><span>${money(lineTotal(l))}</span></div>`).join('');
  const t = tableById(o.tableId);
  const k = await modal(`結帳　${t.name}　#${pad2(o.no)}`, `
    <div class="co">
      <div>
        <div class="bill" style="max-height:220px;overflow:auto;margin-bottom:10px">${lines}</div>
        <div class="grp"><div class="gt">折扣</div><div class="row" style="align-items:center">
          <div class="chips" style="flex:0 0 auto"><button class="chip" data-dt="amt">折 $</button><button class="chip" data-dt="pct">打 %off</button></div>
          <input id="dv" inputmode="numeric" placeholder="0" value="${h(st.discV)}" style="padding:10px;border:1px solid var(--line);border-radius:10px"></div></div>
        <div class="bill" id="bill"></div>
      </div>
      <div>
        <div class="chips" style="margin-bottom:12px"><button class="chip" data-pm="cash" style="flex:1">現金</button><button class="chip" data-pm="card" style="flex:1">信用卡</button></div>
        <div id="cashpad">
          <div class="disp" id="disp"></div>
          <div class="chips" style="margin-bottom:8px"><button class="chip" data-quick="exact">剛好</button><button class="chip" data-quick="100">$100</button><button class="chip" data-quick="500">$500</button><button class="chip" data-quick="1000">$1000</button></div>
          <div class="keypad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', '⌫'].map(x => `<button data-kp="${x}">${x}</button>`).join('')}</div>
        </div>
      </div>
    </div>`, [{ k: 'no', t: '取消' }, { k: 'ok', t: '完成結帳', cls: 'pri big' }], {
    wide: true, dismiss: false,
    onOpen: m => {
      paint(m);
      $('#dv', m).addEventListener('input', e => { st.discV = e.target.value.replace(/\D/g, ''); paint(m); });
      m.addEventListener('click', e => {
        const b = e.target.closest('[data-pm],[data-dt],[data-quick],[data-kp]'); if (!b) return;
        if (b.dataset.pm) st.method = b.dataset.pm;
        if (b.dataset.dt) st.discType = b.dataset.dt;
        if (b.dataset.quick) st.recv = b.dataset.quick === 'exact' ? String(calc().total) : b.dataset.quick;
        if (b.dataset.kp) { const x = b.dataset.kp; st.recv = x === '⌫' ? st.recv.slice(0, -1) : (st.recv + x).replace(/^0+/, '').slice(0, 7); }
        paint(m);
      });
    },
    onBtn: k => {
      if (k !== 'ok') return;
      const c = calc();
      if (st.discType === 'pct' && (+st.discV || 0) > 100) { toast('折扣不能超過 100%', true); return false; }
      if (st.method === 'cash') { if (!st.recv) st.recv = String(c.total); else if (c.change < 0) { toast('收現金額不足', true); return false; } }
    }
  });
  if (k !== 'ok') { o.disc = st.discV ? { type: st.discType, v: +st.discV } : null; save(); return; }
  const c = calc();
  const rec = {
    id: o.id, no: o.no, tableId: o.tableId, tableName: t.name, openedAt: o.openedAt, closedAt: Date.now(),
    lines: o.lines, subtotal: c.sub, discount: c.disc, total: c.total,
    pay: st.method === 'cash' ? { method: 'cash', received: c.recv || c.total, change: (c.recv || c.total) - c.total } : { method: 'card' },
  };
  S.closed.push(rec); delete S.open[o.tableId]; save();
  navigate(() => { V.screen = 'floor'; render(); });
  await printJob(receiptJob(rec), '收據');
  toast(rec.pay.method === 'cash' ? `結帳完成，找零 ${money(rec.pay.change)}` : '結帳完成');
}

function dayRecords(day) { return S.closed.filter(r => dayKey(r.closedAt) === day); }
function stats(recs) {
  const live = recs.filter(r => !r.void);
  const s = { n: live.length, total: 0, cash: 0, card: 0, disc: 0, items: {} };
  for (const r of live) {
    s.total += r.total; s.disc += r.discount; s[r.pay.method] += r.total;
    for (const l of r.lines) { const it = s.items[l.name] || (s.items[l.name] = { q: 0, amt: 0 }); it.q += l.qty; it.amt += lineTotal(l); }
  }
  return s;
}
function renderReports() {

        ${recs.map(r => `<tr class="${r.void ? 'void' : ''}"><td>#${pad2(r.no)}</td><td>${h(r.tableName)}</td><td>${hm(r.closedAt)}</td><td>${r.pay.method === 'cash' ? '現金' : '信用卡'}</td><td class="n">${money(r.total)}</td>
        <td class="n">${r.void ? '<span class="muted" style="text-decoration:none">已作廢</span>' : `<button class="mini" data-act="reprint" data-id="${r.id}">補印</button> <button class="mini" data-act="voidRec" data-id="${r.id}">作廢</button>`}</td></tr>`).join('')}</table>` : '<div class="muted">這天沒有訂單</div>'}</div>
    </div></div>`;

function dailyJob(day) {
  const s = stats(dayRecords(day));
  const job = [J.align('center'), J.txt(S.settings.shopName, { w: 2, h: 2, b: true }), J.txt('日結單 ' + day.replace(/-/g, '/')), J.feed(1), J.align('left')];
  job.push(J.txt(lr('列印時間', fmtTime(Date.now()))), J.txt(rule()));
  job.push(J.txt(lr('營業額', money(s.total)), { b: true }), J.txt(lr('單數', String(s.n))), J.txt(lr('現金', money(s.cash))), J.txt(lr('信用卡', money(s.card))), J.txt(lr('折扣總額', money(s.disc))));
  job.push(J.txt(rule()), J.txt('品項銷量', { b: true }));
  Object.entries(s.items).sort((a, b) => b[1].q - a[1].q).forEach(([n, v]) => job.push(J.txt(lr(n, `x${v.q}  ${padL(money(v.amt), 8)}`))));
  job.push(J.txt(rule()), J.feed(2), J.cut());
  return job;
}

function bindDrag(floor) {
  let op = null;
  floor.addEventListener('pointerdown', e => {
    const el = e.target.closest('.tbl'); if (!el) return;
    const r = floor.getBoundingClientRect(), er = el.getBoundingClientRect(), t = tableById(el.dataset.id);
    op = { el, t, r, er, mode: e.target.closest('.rh') ? 'resize' : 'move', dx: e.clientX - er.left, dy: e.clientY - er.top, moved: false };
    el.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  floor.addEventListener('pointermove', e => {
    if (!op) return;
    const { r, el, t } = op;
    if (!op.moved) { op.moved = true; el.classList.add('dragging'); }
    const pct = (v, total) => Math.round(v / total * 1000) / 10;
    if (op.mode === 'move') {
      const x = Math.min(Math.max(0, e.clientX - r.left - op.dx), r.width - el.offsetWidth);
      const y = Math.min(Math.max(0, e.clientY - r.top - op.dy), r.height - el.offsetHeight);
      t.x = pct(x, r.width); t.y = pct(y, r.height);
      el.style.left = t.x + '%'; el.style.top = t.y + '%';
    } else {
      const left = op.er.left - r.left, top = op.er.top - r.top;
      let w = Math.min(Math.max(r.width * 0.04, e.clientX - op.er.left), r.width - left);
      let hh = Math.min(Math.max(r.height * 0.06, e.clientY - op.er.top), r.height - top);
      if (t.shape === 'round') { w = Math.min(w, r.height - top); hh = w; } // 圓桌保持正圓
      t.w = pct(w, r.width); t.h = pct(hh, r.height);
      el.style.width = t.w + '%'; el.style.height = t.h + '%';
    }
  });
  const end = () => {
    if (!op) return;
    const { t, moved } = op; op = null;
    if (moved) save();
    V.editTable = t.id; render();
  };
  floor.addEventListener('pointerup', end); floor.addEventListener('pointercancel', end);
}

async function backup() {
  const name = `pos-backup-${dayKey(Date.now())}.json`;
  S.lastBackup = Date.now();
  const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
  const file = new File([blob], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); }
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
    save(); render(); toast('備份檔已匯出，請存到「檔案」或傳到雲端');
  } catch (e) { S.lastBackup = 0; if (e.name !== 'AbortError') toast('匯出失敗：' + e.message, true); }
}
async function restore(e) {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.items) || !Array.isArray(d.tables)) throw new Error('不是這個 POS 的備份檔');
    if (!(await ask('從備份還原', `會用「${h(f.name)}」覆蓋目前所有資料（包含進行中的桌）。確定嗎？`, '覆蓋還原', 'warn'))) return;
    S = migrate(d); save(); V.area = S.areas[0]?.id; render(); toast('已還原');
  } catch (err) { toast('還原失敗：' + err.message, true); }
}

document.addEventListener('click', e => {
  if (e.target.closest('.mask')) return; // 對話框自己處理
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (f) f(b, e);
});
// 每 30 秒更新時間與桌位用餐時間
setInterval(() => {
  const c = $('#clock'); if (c) c.textContent = hm(Date.now());
  if (V.screen === 'floor' && !document.querySelector('.mask')) { renderFloor(); afterRender(); }
}, 30000);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
render();
</script>
</body>
</html>
